<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Para vos ❤</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ====== Colores (cambialos a gusto) ====== */
  :root {
    --fondo1: #ffe4ec;
    --fondo2: #ffd1dc;
    --acento: #e63e6d;
    --texto: #4a2030;
    --tarjeta: rgba(255,255,255,.75);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--texto);
    background: linear-gradient(160deg, var(--fondo1), var(--fondo2));
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ====== Pantalla de inicio (toque para abrir) ====== */
  #inicio {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--fondo1), var(--fondo2));
    cursor: pointer; transition: opacity .8s;
    text-align: center; padding: 24px;
  }
  #inicio.oculto { opacity: 0; pointer-events: none; }
  .corazon-grande {
    font-size: 110px; color: var(--acento);
    animation: latido 1.2s infinite;
  }
  #inicio p { margin-top: 18px; font-size: 1.1rem; opacity: .8; }
  @keyframes latido {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
  }

  /* ====== Contenido ====== */
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 60px; }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 3rem; text-align: center; color: var(--acento);
    margin-bottom: 8px;
  }
  .subtitulo { text-align: center; opacity: .75; margin-bottom: 28px; }

  .tarjeta {
    background: var(--tarjeta);
    border-radius: 20px; padding: 20px;
    box-shadow: 0 8px 30px rgba(230,62,109,.15);
    margin-bottom: 24px;
  }

  /* Reproductor */
  .reproductor { display: flex; align-items: center; gap: 16px; }
  #btnPlay {
    flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: var(--acento); color: #fff; font-size: 26px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(230,62,109,.4);
  }
  .barra { flex: 1; }
  .barra-fondo { height: 6px; background: rgba(230,62,109,.2); border-radius: 3px; overflow: hidden; }
  #progreso { height: 100%; width: 0; background: var(--acento); transition: width .2s linear; }
  #tiempo { font-size: .85rem; opacity: .7; margin-top: 6px; }

  /* Mensaje */
  .mensaje { font-size: 1.1rem; line-height: 1.6; white-space: pre-line; }

  /* Galería */
  .galeria { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .galeria img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);
  }
  .galeria img:first-child,
  .galeria img:last-child:nth-child(even) { grid-column: span 2; aspect-ratio: 4/3; }

  /* Visor de foto */
  #visor {
    position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 20;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #visor.abierto { display: flex; }
  #visor img { max-width: 100%; max-height: 90vh; border-radius: 10px; }

  .firma {
    font-family: 'Dancing Script', cursive;
    text-align: right; font-size: 1.6rem; color: var(--acento); margin-top: 12px;
  }

  /* Corazones flotando */
  .flotante {
    position: fixed; bottom: -40px; color: var(--acento);
    pointer-events: none; animation: subir linear forwards; opacity: .6;
  }
  @keyframes subir { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>

<div id="inicio">
  <div class="corazon-grande">❤</div>
  <p>Tocá el corazón</p>
</div>

<main>
  <h1 id="titulo"></h1>
  <p class="subtitulo" id="subtitulo"></p>

  <div class="tarjeta">
    <div class="reproductor">
      <button id="btnPlay" aria-label="Reproducir">▶</button>
      <div class="barra">
        <div class="barra-fondo"><div id="progreso"></div></div>
        <div id="tiempo">Un mensaje para vos</div>
      </div>
    </div>
  </div>

  <div class="tarjeta">
    <p class="mensaje" id="mensaje"></p>
    <p class="firma" id="firma"></p>
  </div>

  <div class="galeria" id="galeria"></div>
</main>

<div id="visor"><img alt=""></div>

<audio id="audio" src="audio/mensaje.mp3" preload="auto"></audio>

<script>
  /* =========================================================
     EDITÁ ACÁ: textos y lista de fotos
     ========================================================= */
  const CONFIG = {
    titulo: "Para [nombre]",
    subtitulo: "Juntos desde [fecha]",
    mensaje: `Escribí acá tu mensaje.

Podés usar varias líneas.`,
    firma: "Axel",
    cantidadFotos: 11   // fotos/1.jpg ... fotos/11.jpg
  };
  CONFIG.fotos = Array.from({ length: CONFIG.cantidadFotos }, (_, i) => `fotos/${i + 1}.jpg`);
  /* ========================================================= */

  document.getElementById("titulo").textContent = CONFIG.titulo;
  document.getElementById("subtitulo").textContent = CONFIG.subtitulo;
  document.getElementById("mensaje").textContent = CONFIG.mensaje;
  document.getElementById("firma").textContent = CONFIG.firma;

  const galeria = document.getElementById("galeria");
  const visor = document.getElementById("visor");
  CONFIG.fotos.forEach(src => {
    const img = document.createElement("img");
    img.src = src; img.loading = "lazy"; img.alt = "";
    img.onclick = () => { visor.querySelector("img").src = src; visor.classList.add("abierto"); };
    galeria.appendChild(img);
  });
  visor.onclick = () => visor.classList.remove("abierto");

  const audio = document.getElementById("audio");
  const btn = document.getElementById("btnPlay");
  const prog = document.getElementById("progreso");
  const tiempo = document.getElementById("tiempo");
  const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";

  btn.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => btn.textContent = "❚❚";
  audio.onpause = () => btn.textContent = "▶";
  audio.onended = () => { btn.textContent = "▶"; prog.style.width = "0"; };
  audio.ontimeupdate = () => {
    prog.style.width = (audio.currentTime / audio.duration * 100 || 0) + "%";
    tiempo.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
  };

  // Al tocar el corazón inicial: se abre la página y arranca el audio
  // (los celulares no permiten reproducir audio sin un toque previo)
  document.getElementById("inicio").onclick = function () {
    this.classList.add("oculto");
    audio.play().catch(() => {});
    setInterval(corazon, 700);
  };

  function corazon() {
    const c = document.createElement("div");
    c.className = "flotante";
    c.textContent = "❤";
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = (14 + Math.random() * 20) + "px";
    c.style.animationDuration = (6 + Math.random() * 5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 12000);
  }
</script>
</body>
</html>
