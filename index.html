<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c0d1c">
<title>Para vos ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ====== Paleta ====== */
  :root {
    --noche: #1c0d1c;      /* fondo */
    --ciruela: #3b1838;    /* fondo secundario */
    --rubor: #f2b8c6;      /* rosa suave */
    --vela: #f7d79a;       /* luz cálida */
    --papel: #fbf4ef;      /* polaroids y carta */
    --tinta: #3a1f2b;      /* texto sobre papel */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--noche);
    color: var(--papel);
    font-family: 'Karla', system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  img { display: block; }

  /* ====== Portada: toque para abrir ====== */
  #portada {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 50% 45%, var(--ciruela), var(--noche) 70%);
    cursor: pointer;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #portada.abierta { opacity: 0; visibility: hidden; }
  .sobre { display: grid; justify-items: center; gap: 22px; padding: 24px; }
  .latido {
    width: 84px; height: 84px; color: var(--rubor);
    filter: drop-shadow(0 0 18px rgba(242,184,198,.55));
    animation: latido 1.4s infinite;
  }
  .sobre p { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.5rem; opacity: .85; }
  @keyframes latido {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.14); }
    28% { transform: scale(1); }
    42% { transform: scale(1.08); }
  }

  /* ====== Portada de fotos con movimiento lento ====== */
  .escena {
    position: relative; height: 100vh; height: 100svh;
    overflow: hidden; background: var(--noche);
  }
  .diapo {
    position: absolute; inset: -4%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2s ease;
  }
  .diapo.activa { opacity: 1; animation: deriva 9s linear forwards; }
  .diapo:nth-child(odd).activa { animation-name: deriva2; }
  @keyframes deriva  { from { transform: scale(1.02) translate(0,0); }   to { transform: scale(1.14) translate(-2%, -1.5%); } }
  @keyframes deriva2 { from { transform: scale(1.14) translate(2%, 1%); } to { transform: scale(1.02) translate(0,0); } }
  .escena::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to top, var(--noche) 0%, rgba(28,13,28,.55) 30%, rgba(28,13,28,0) 60%),
      radial-gradient(ellipse at center, transparent 55%, rgba(28,13,28,.55));
  }
  .titular {
    position: absolute; z-index: 2; left: 0; right: 0; bottom: 0;
    padding: 0 24px calc(56px + env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  .titular h1 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(3.2rem, 15vw, 6rem); line-height: .95; letter-spacing: -.01em;
    color: var(--papel);
    text-shadow: 0 2px 30px rgba(28,13,28,.6);
  }
  .titular p {
    margin-top: 12px; font-family: 'Instrument Serif', serif; font-style: italic;
    font-size: 1.35rem; color: var(--vela);
  }
  .bajar {
    position: absolute; z-index: 2; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    width: 22px; height: 22px; margin-left: -11px; opacity: .6;
    border-right: 2px solid var(--papel); border-bottom: 2px solid var(--papel);
    transform: rotate(45deg); animation: flotar 2.4s ease-in-out infinite;
  }
  @keyframes flotar { 50% { translate: 0 6px; } }

  /* ====== Carta ====== */
  .carta-zona { padding: 72px 20px 40px; display: grid; place-items: center; }
  .carta {
    position: relative; width: 100%; max-width: 520px;
    background: var(--papel); color: var(--tinta);
    padding: 40px 30px 34px; border-radius: 3px;
    transform: rotate(-1.2deg);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(58,31,43,.06) inset;
    background-image: repeating-linear-gradient(transparent 0 33px, rgba(58,31,43,.08) 33px 34px);
    background-position: 0 70px;
  }
  .carta::before { /* cinta */
    content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px;
    margin-left: -55px; transform: rotate(3deg);
    background: rgba(242,184,198,.75);
  }
  .mensaje {
    font-family: 'Caveat', cursive; font-weight: 500;
    font-size: 1.6rem; line-height: 34px; white-space: pre-line;
  }
  .firma {
    margin-top: 18px; text-align: right;
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.9rem; color: #b23a5e;
  }

  /* ====== Polaroids desparramadas ====== */
  .mesa {
    max-width: 640px; margin: 0 auto; padding: 40px 18px 120px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 34px 18px;
  }
  .polaroid {
    background: var(--papel); padding: 8px 8px 30px; border-radius: 2px;
    box-shadow: 0 18px 30px -12px rgba(0,0,0,.7);
    transform: translate(var(--dx), var(--dy)) rotate(var(--r));
    cursor: zoom-in; border: 0; width: 100%;
    animation: mecer var(--t) ease-in-out infinite alternate;
    transform-origin: 50% -20%;
  }
  .polaroid:nth-child(5n+1) { grid-column: span 2; width: 78%; justify-self: center; }
  .polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--ciruela); }
  .polaroid:focus-visible { outline: 3px solid var(--vela); outline-offset: 4px; }
  @keyframes mecer {
    from { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
    to   { transform: translate(var(--dx), var(--dy)) rotate(calc(var(--r) * -0.4)); }
  }
  .final {
    text-align: center; padding: 0 24px 140px;
    font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.6rem; color: var(--rubor);
  }

  /* ====== Visor ====== */
  #visor {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(28,13,28,.94);
    display: grid; place-items: center; padding: 20px;
    opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
  }
  #visor.abierto { opacity: 1; visibility: visible; }
  #visor .marco {
    background: var(--papel); padding: 10px 10px 40px; border-radius: 2px;
    transform: rotate(-1deg) scale(.92); transition: transform .35s ease;
    max-width: 100%;
  }
  #visor.abierto .marco { transform: rotate(-1deg) scale(1); }
  #visor img { max-width: min(86vw, 560px); max-height: 72vh; object-fit: contain; }
  #visor .ayuda { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: .9rem; opacity: .55; }

  /* ====== Reproductor escondido ====== */
  #disco {
    position: fixed; z-index: 30;
    right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom));
    width: 50px; height: 50px; border-radius: 50%; border: 0; padding: 0;
    background: rgba(59,24,56,.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: var(--rubor); cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; transition: opacity .8s .6s;
  }
  body.abierto #disco { opacity: 1; }
  #disco svg.aro { position: absolute; inset: 0; transform: rotate(-90deg); }
  #disco .icono { width: 20px; height: 20px; transition: transform .3s; }
  #disco.sonando .icono { animation: latido 1.4s infinite; }
  #disco.escuchado:not(.sonando) .icono { opacity: .6; }
  /* antes de escucharlo: un halo suave que invita a tocar */
  #disco:not(.escuchado)::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(242,184,198,.55);
    animation: halo 2.2s ease-out infinite;
  }
  @keyframes halo { to { box-shadow: 0 0 0 16px rgba(242,184,198,0); } }
  .pista {
    position: absolute; right: 62px; top: 50%; translate: 0 -50%;
    white-space: nowrap; pointer-events: none;
    font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.1rem; color: var(--papel);
    background: rgba(59,24,56,.75); padding: 5px 12px; border-radius: 14px;
    transition: opacity .6s;
  }
  #disco.escuchado .pista { opacity: 0; }
  #disco:focus-visible { outline: 2px solid var(--vela); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="portada" role="button" tabindex="0" aria-label="Abrir">
  <div class="sobre">
    <svg class="latido" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
    <p>Tocá el corazón</p>
  </div>
</div>

<header class="escena" id="escena">
  <div class="titular">
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </div>
  <div class="bajar" aria-hidden="true"></div>
</header>

<section class="carta-zona">
  <article class="carta">
    <p class="mensaje" id="mensaje"></p>
    <p class="firma" id="firma"></p>
  </article>
</section>

<section class="mesa" id="mesa" aria-label="Fotos"></section>
<p class="final" id="final"></p>

<div id="visor" aria-hidden="true">
  <div class="marco"><img alt=""></div>
  <p class="ayuda">Tocá para ver la siguiente</p>
</div>

<button id="disco" aria-label="Escuchar mensaje de audio">
  <svg class="aro" viewBox="0 0 50 50" aria-hidden="true">
    <circle cx="25" cy="25" r="23" fill="none" stroke="rgba(242,184,198,.18)" stroke-width="2"/>
    <circle id="progreso" cx="25" cy="25" r="23" fill="none" stroke="#f2b8c6" stroke-width="2"
            stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="144.5"/>
  </svg>
  <svg class="icono" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.6l1 1.4 1-1.4C14 6.1 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>
</button>

<audio id="audio" src="mensaje.mp3" preload="auto"></audio>

<script>
  /* =========================================================
     EDITÁ ACÁ
     ========================================================= */
  const CONFIG = {
    titulo: "Para Valen",
    subtitulo: "Juntos desde 12-04-25",
    mensaje: `Te amo, gracias por apoyarme siempre.
Feliz primer año juntos, ¡por muchos más!`,
    firma: "Axel",
    final: "Te amo",          // frase al final de las fotos (dejala vacía "" para quitarla)
    cantidadFotos: 11,        // 1.jpg ... 11.jpg en la raíz del repo
    segundosPorFoto: 6
  };
  /* ========================================================= */

  const fotos = Array.from({ length: CONFIG.cantidadFotos }, (_, i) => `${i + 1}.jpg`);
  const $ = id => document.getElementById(id);
  $("titulo").textContent = CONFIG.titulo;
  $("subtitulo").textContent = CONFIG.subtitulo;
  $("mensaje").textContent = CONFIG.mensaje;
  $("firma").textContent = CONFIG.firma;
  $("final").textContent = CONFIG.final;

  /* --- Portada con fotos que van pasando --- */
  const escena = $("escena");
  const diapos = fotos.map(src => {
    const d = document.createElement("div");
    d.className = "diapo";
    d.style.backgroundImage = `url("${src}")`;
    escena.prepend(d);
    return d;
  }).reverse();
  let actual = 0;
  diapos[0].classList.add("activa");
  function siguienteDiapo() {
    const prev = diapos[actual];
    actual = (actual + 1) % diapos.length;
    const sig = diapos[actual];
    sig.style.animation = "none"; sig.offsetHeight; sig.style.animation = "";
    sig.classList.add("activa");
    setTimeout(() => prev.classList.remove("activa"), 2000);
  }
  if (diapos.length > 1) setInterval(siguienteDiapo, CONFIG.segundosPorFoto * 1000);

  /* --- Polaroids desparramadas que se mecen --- */
  const mesa = $("mesa");
  const azar = (a, b) => a + Math.random() * (b - a);
  fotos.forEach((src, i) => {
    const b = document.createElement("button");
    b.className = "polaroid";
    b.setAttribute("aria-label", `Ver foto ${i + 1}`);
    b.style.setProperty("--r", `${azar(-6, 6).toFixed(1)}deg`);
    b.style.setProperty("--dx", `${azar(-8, 8).toFixed(0)}px`);
    b.style.setProperty("--dy", `${azar(-10, 10).toFixed(0)}px`);
    b.style.setProperty("--t", `${azar(4, 7).toFixed(1)}s`);
    const img = document.createElement("img");
    img.src = src; img.alt = ""; img.loading = "lazy";
    b.appendChild(img);
    b.onclick = () => abrirVisor(i);
    mesa.appendChild(b);
  });

  /* --- Visor: tocar pasa a la siguiente, deslizar hacia abajo cierra --- */
  const visor = $("visor"), imgVisor = visor.querySelector("img");
  let enVisor = 0, y0 = null;
  function abrirVisor(i) { enVisor = i; imgVisor.src = fotos[i]; visor.classList.add("abierto"); visor.setAttribute("aria-hidden", "false"); }
  function cerrarVisor() { visor.classList.remove("abierto"); visor.setAttribute("aria-hidden", "true"); }
  visor.onclick = e => {
    if (e.target === visor) return cerrarVisor();
    enVisor = (enVisor + 1) % fotos.length; imgVisor.src = fotos[enVisor];
  };
  visor.addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
  visor.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 80) cerrarVisor(); y0 = null; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarVisor(); });

  /* --- Reproductor escondido: el corazoncito de la esquina --- */
  const audio = $("audio"), disco = $("disco"), aro = $("progreso");
  const LARGO = 144.5;
  disco.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => { disco.classList.add("sonando", "escuchado"); disco.setAttribute("aria-label", "Pausar mensaje de audio"); };
  audio.onpause = () => { disco.classList.remove("sonando"); disco.setAttribute("aria-label", "Escuchar mensaje de audio"); };
  audio.ontimeupdate = () => {
    const p = audio.duration ? audio.currentTime / audio.duration : 0;
    aro.style.strokeDashoffset = LARGO * (1 - p);
  };
  audio.onended = () => { aro.style.strokeDashoffset = LARGO; };

  /* --- Abrir: arranca el audio (los celulares exigen un toque) --- */
  const portada = $("portada");
  function abrir() {
    if (portada.classList.contains("abierta")) return;
    portada.classList.add("abierta");
    document.body.classList.add("abierto");
  }
  portada.onclick = abrir;
  portada.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } };
</script>
</body>
</html>
